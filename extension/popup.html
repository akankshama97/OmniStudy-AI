<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 320px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0F172A;
      color: #F8FAFC;
      margin: 0;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
      border-bottom: 1px solid #334155;
      padding-bottom: 10px;
    }
    .title {
      font-size: 16px;
      font-weight: 800;
      color: #60A5FA;
    }
    .desc {
      font-size: 12px;
      color: #94A3B8;
      line-height: 1.4;
      margin-bottom: 14px;
    }
    .btn {
      width: 100%;
      padding: 10px;
      background: #2563EB;
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.2s;
    }
    .btn:hover {
      background: #1D4ED8;
    }
    .status {
      margin-top: 10px;
      font-size: 11px;
      color: #38BDF8;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="header">
    <span style="font-size: 22px;">⚡</span>
    <div>
      <div class="title">OmniStudy AI</div>
      <div style="font-size: 10px; color: #64748B;">YouTube to Notebook Notes</div>
    </div>
  </div>
  <div class="desc">
    Convert current YouTube video into handwritten classroom notes, SVG diagrams, and exam PYQs!
  </div>
  <button id="generateBtn" class="btn">
    <span>📝 Generate Notes for Current Video</span>
  </button>
  <div id="status" class="status"></div>
  <script src="popup.js"></script>
</body>
</html>
